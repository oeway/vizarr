<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REEF Acquisitions Explorer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a; color: #e0e0e0;
    }
    body { display: flex; }

    aside {
      width: 320px; min-width: 240px; max-width: 50%;
      background: #2a2a2a; border-right: 1px solid #444;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    aside header {
      padding: 12px 16px;
      border-bottom: 1px solid #444;
      background: #333;
    }
    aside header h1 {
      margin: 0; font-size: 15px; font-weight: 600;
      color: #fafafa;
    }
    aside header .sub {
      margin-top: 2px; font-size: 11px; color: #999;
      font-family: "SF Mono", "Monaco", monospace;
    }
    aside .toolbar {
      padding: 8px 12px;
      border-bottom: 1px solid #3a3a3a;
      display: flex; gap: 6px; align-items: center;
    }
    aside .toolbar input {
      flex: 1; background: #1e1e1e; color: #e0e0e0;
      border: 1px solid #444; border-radius: 4px;
      padding: 6px 8px; font-size: 12px; outline: none;
    }
    aside .toolbar input:focus { border-color: #4a90e2; }
    aside .toolbar button {
      background: #3a3a3a; color: #ddd; border: 1px solid #555;
      border-radius: 4px; padding: 6px 10px; font-size: 11px;
      cursor: pointer;
    }
    aside .toolbar button:hover { background: #4a4a4a; }

    aside .list {
      flex: 1; overflow-y: auto; padding: 4px 0;
    }
    aside .item {
      padding: 10px 16px; cursor: pointer;
      border-bottom: 1px solid #333;
      transition: background 0.1s;
    }
    aside .item:hover { background: #353535; }
    aside .item.active {
      background: #2a3f5f; border-left: 3px solid #4a90e2;
      padding-left: 13px;
    }
    aside .item .name {
      font-size: 13px; font-weight: 500; color: #fafafa;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    aside .item .meta {
      margin-top: 3px; font-size: 11px; color: #888;
      font-family: "SF Mono", monospace;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    aside .item .badge {
      display: inline-block; background: #444; color: #ccc;
      padding: 1px 6px; border-radius: 3px; font-size: 10px;
      margin-right: 4px;
    }
    aside .item .badge.zip { background: #2a5f3a; color: #afa; }
    aside .item .badge.raw { background: #5f2a2a; color: #fbb; }

    aside .footer {
      padding: 8px 16px; font-size: 11px; color: #888;
      border-top: 1px solid #444;
      font-family: "SF Mono", monospace;
    }
    aside .empty {
      padding: 20px; text-align: center; color: #888; font-size: 12px;
    }
    aside .err {
      padding: 16px; color: #f88; font-size: 12px;
      background: #3a2222; margin: 8px;
      border-radius: 4px; border: 1px solid #5a3030;
    }

    main {
      flex: 1; display: flex; flex-direction: column;
      background: #000;
    }
    main .placeholder {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: #666; font-size: 14px;
    }
    main iframe {
      flex: 1; width: 100%; height: 100%;
      border: none; background: #000;
    }
  </style>
</head>
<body>

<aside>
  <header>
    <h1>🔬 REEF Acquisitions</h1>
    <div class="sub" id="ws-info">connecting…</div>
  </header>

  <div class="toolbar">
    <input id="filter" placeholder="filter by alias…" />
    <button id="reload">↻</button>
  </div>

  <div class="list" id="list">
    <div class="empty">loading artifacts…</div>
  </div>

  <div class="footer" id="footer">—</div>
</aside>

<main>
  <div class="placeholder" id="placeholder">
    select an acquisition from the sidebar
  </div>
  <iframe id="viewer" style="display:none"></iframe>
</main>

<script type="module">
import { hyphaWebsocketClient } from "https://cdn.jsdelivr.net/npm/hypha-rpc@0.20/dist/hypha-rpc-websocket.mjs";

// ── Configuration ──────────────────────────────────────────────────────────
const SERVER     = "https://hypha.aicell.io";
const WORKSPACE  = "reef-imaging";
const COLLECTION = `${WORKSPACE}/reef-acquisitions`;

// vizarr lives at the parent dir of /explorer/ — i.e. one level up.
const VIZARR_PATH = new URL("../", window.location.href).pathname;

// Token: read from URL query (?token=xxx) or from localStorage; fall back
// to anonymous (which works for public artifacts only).
function getToken() {
  const url = new URL(window.location.href);
  const t = url.searchParams.get("token");
  if (t) {
    localStorage.setItem("hypha_token", t);
    url.searchParams.delete("token");
    window.history.replaceState({}, "", url.href);
    return t;
  }
  return localStorage.getItem("hypha_token") || null;
}

// ── State ──────────────────────────────────────────────────────────────────
let svc = null;
let allArtifacts = [];
let selectedAlias = null;

// ── DOM helpers ────────────────────────────────────────────────────────────
const $list        = document.getElementById("list");
const $filter      = document.getElementById("filter");
const $reload      = document.getElementById("reload");
const $wsInfo      = document.getElementById("ws-info");
const $footer      = document.getElementById("footer");
const $placeholder = document.getElementById("placeholder");
const $viewer      = document.getElementById("viewer");

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const q = $filter.value.trim().toLowerCase();
  const filtered = q
    ? allArtifacts.filter(a => (a.alias || a.id || "").toLowerCase().includes(q))
    : allArtifacts;

  if (filtered.length === 0) {
    $list.innerHTML = `<div class="empty">no acquisitions${q ? " match" : ""}</div>`;
  } else {
    $list.innerHTML = filtered.map(a => {
      const m = a.manifest || {};
      const fmt = m.format || "?";
      const isZip = fmt.includes("zip");
      const badgeClass = isZip ? "zip" : (fmt.includes("directory") ? "raw" : "");
      const sub = [
        m.plate_type && `${m.plate_type}-well`,
        m.objective,
        m.scan_type,
      ].filter(Boolean).join(" · ");
      const isActive = a.alias === selectedAlias ? " active" : "";
      return `
        <div class="item${isActive}" data-alias="${escapeHtml(a.alias)}">
          <div class="name">${escapeHtml(m.name || a.alias)}</div>
          <div class="meta">
            <span class="badge ${badgeClass}">${escapeHtml(fmt)}</span>
            ${escapeHtml(sub)}
          </div>
        </div>
      `;
    }).join("");

    for (const el of $list.querySelectorAll(".item")) {
      el.addEventListener("click", () => openArtifact(el.dataset.alias));
    }
  }
  $footer.textContent = `${filtered.length}/${allArtifacts.length} artifacts`;
}

function openArtifact(alias) {
  selectedAlias = alias;
  const artifact = allArtifacts.find(a => a.alias === alias);
  if (!artifact) return;
  const m = artifact.manifest || {};

  // Pick the URL vizarr should treat as the image root.
  // Priority: explicit vizarr_source > viewer_url_template > format-aware fallback.
  let src = m.vizarr_source || m.viewer_url_template;
  if (!src) {
    const fmt = m.format || "";
    if (fmt.includes("zip") || m.blob_path) {
      // Single-zip artifact: served via Hypha's /zip-files/<zip>/~/<entry>
      src = `${SERVER}/${WORKSPACE}/artifacts/${alias}/zip-files/${m.blob_path || "data.zarr.zip"}/~/`;
    } else {
      // Raw directory artifact: served via /files/<path>; vizarr root = files dir
      src = `${SERVER}/${WORKSPACE}/artifacts/${alias}/files/`;
    }
  }

  // Vizarr query params: source=<URL>.  If we have a token, append it so the
  // iframe's HTTP requests authenticate.
  const token = getToken();
  const params = new URLSearchParams({source: src});
  if (token) params.set("token", token);

  const url = `${VIZARR_PATH}?${params.toString()}`;
  console.log("opening", alias, "→", url);
  $viewer.src = url;
  $viewer.style.display = "";
  $placeholder.style.display = "none";

  render();   // refresh the active highlight
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  const token = getToken();
  $wsInfo.textContent = `${WORKSPACE} ${token ? "✓ authed" : "(anonymous)"}`;

  try {
    const server = await hyphaWebsocketClient.connectToServer({
      server_url: SERVER, workspace: WORKSPACE, token,
    });
    svc = await server.getService("public/artifact-manager");
    await loadList();
  } catch (err) {
    console.error("connect failed:", err);
    $list.innerHTML = `<div class="err">
      Failed to connect: ${escapeHtml(String(err.message || err))}<br><br>
      Pass a token via <code>?token=&lt;hypha-token&gt;</code> in the URL,
      or run <code>hypha token --workspace reef-imaging</code> to get one.
    </div>`;
  }
}

async function loadList() {
  $list.innerHTML = `<div class="empty">loading…</div>`;
  try {
    // hypha-rpc JS treats object args as positional, not kwargs.  Pass
    // parent_id as the first positional, then an empty options object.
    // (Equivalent to Python svc.list(parent_id=COLLECTION).)
    const children = await svc.list(COLLECTION);
    // Sort newest first by created_at (numeric epoch or ISO string both work
    // with simple < / > since ISO strings are lexicographically ordered).
    allArtifacts = (children || []).slice().sort((a, b) => {
      const ca = a.created_at ?? 0, cb = b.created_at ?? 0;
      if (ca < cb) return 1;
      if (ca > cb) return -1;
      return String(a.alias || "").localeCompare(String(b.alias || ""));
    });
    render();
  } catch (err) {
    console.error("list failed:", err);
    $list.innerHTML = `<div class="err">list failed: ${escapeHtml(String(err.message || err))}</div>`;
  }
}

$reload.addEventListener("click", loadList);
$filter.addEventListener("input", render);

init();
</script>

</body>
</html>
